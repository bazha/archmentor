name: Trello task agent

on:
  schedule:
    - cron: "*/15 * * * *"   # every ~15 min (GitHub cron is best-effort; may lag 5-30 min)
  workflow_dispatch: {}

concurrency:
  group: trello-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write   # required by anthropics/claude-code-action (OIDC)

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}   # PR/push as a real user so CodeRabbit auto-reviews

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "trello-agent"
          git config user.email "trello-agent@users.noreply.github.com"

      - name: Select and claim a card
        id: sel
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
          TRELLO_INPROGRESS_LIST_ID: ${{ secrets.TRELLO_INPROGRESS_LIST_ID }}
          TRELLO_INREVIEW_LIST_ID: ${{ secrets.TRELLO_INREVIEW_LIST_ID }}
        run: |
          chmod +x .github/scripts/trello.sh
          id="$(.github/scripts/trello.sh select-and-claim)"
          echo "card_id=$id" >> "$GITHUB_OUTPUT"
          if [ -z "$id" ]; then echo "No eligible card; nothing to do."; fi

      - name: Run Claude on the card
        if: steps.sel.outputs.card_id != ''
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}   # open the PR as a real user (CodeRabbit skips bot PRs)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--dangerously-skip-permissions"
          prompt: |
            You are running UNATTENDED in CI (no human to answer questions). Implement ONE Trello
            card as a pull request in THIS repository (your current working directory). Never merge
            or deploy; never touch Trello (the workflow does that).

            Read the card from ./.trello-card.json  (fields: id, name, desc).
            Write your machine-readable outcome to ./.trello-result.json with schema:
            {"status":"pr"|"needs-info"|"error","prUrl":"","branch":"","questions":[],"note":""}

            Procedure:
            1. If the card is too vague, ambiguous, or too large for one focused PR, DO NOT write
               code — write {"status":"needs-info","questions":["...blocking questions..."]} and stop.
            2. Otherwise (light cycle): create a branch trello/<card-id>-<short-slug>. Write a SHORT
               spec + plan under docs/superpowers/. Implement via TDD. Keep scope to the card.
            3. Run `npm test` and `npx tsc --noEmit`; both MUST be green. If not, write
               {"status":"error","note":"tests/tsc red: ..."} and stop (no PR).
            4. Commit with NO Claude/Co-Authored-By/"Generated with" attribution. Push the branch.
               Open a PR with `gh pr create --fill --base master`. Do NOT merge.
            5. Write {"status":"pr","prUrl":"<url>","branch":"<branch>"}.

            Constraints: no new dependencies unless the card requires them; follow CLAUDE.md and
            existing patterns; never print secrets. Always write ./.trello-result.json before exiting.

      - name: Finalize the card
        if: always() && steps.sel.outputs.card_id != ''
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
          TRELLO_INPROGRESS_LIST_ID: ${{ secrets.TRELLO_INPROGRESS_LIST_ID }}
          TRELLO_INREVIEW_LIST_ID: ${{ secrets.TRELLO_INREVIEW_LIST_ID }}
        run: .github/scripts/trello.sh finalize "${{ steps.sel.outputs.card_id }}"
